name: news-sync
# AIニュース日報（定期タスク）が Google Drive に置いた JSON を取り込み、アプリ用 app.json を作り直す。
# 定期タスクの配信（7:45 JST 起動）後、7:50〜9:50 JST に 15 分おきに確認する。
on:
  schedule:
    - cron: "50 22 * * *"
    - cron: "5,20,35,50 23,0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-star-ranking
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/news_sync.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news docs/data/app.json
          git diff --cached --quiet || git commit -m "news: sync from Drive $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase origin main && git push
