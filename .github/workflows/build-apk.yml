name: build-apk
# 家計簿アプリ（my_forward）と同じ運用:
# - 自動では走らせない。APK が要るときだけ claude/apk-* ブランチに main を push して回す
#     git push origin origin/main:refs/heads/claude/apk-N
# - 画面（docs/）を APK に同梱し、圏外でも起動できる。データは GitHub Pages から取得する
# - 固定の署名鍵（main の毎朝ジョブが Actions キャッシュに保持）で署名し、上書きインストールできる。指紋が一致しなければ配布しない
# - versionCode とリリースのタグ（android-N）に run_number を使い、アプリ内の更新確認と比べる
on:
  workflow_dispatch:
  push:
    branches: ['claude/apk-*']
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: signing
          key: android-signing-key-v1
          fail-on-cache-miss: true
      - run: mkdir -p android-app/signing && cp signing/ci-debug.keystore android-app/signing/
      - name: Build
        working-directory: android-app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm install
          rm -rf www && mkdir www && cp -r ../docs/. www/
          echo "{\"build\": $BUILD_NUMBER}" > www/build.json
          npx cap add android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />#' android/app/src/main/AndroidManifest.xml
          # versionCode をビルド番号に、署名を固定鍵に
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle"; s = open(p).read()
          s = re.sub(r"versionCode \d+", "versionCode " + os.environ["BUILD_NUMBER"], s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "1.' + os.environ["BUILD_NUMBER"] + '"', s)
          ks = os.path.abspath("signing/ci-debug.keystore")
          s = s.replace("buildTypes {", "signingConfigs {\n        fixed {\n            storeFile file('" + ks + "')\n            storeType 'PKCS12'\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n    buildTypes {\n        debug { signingConfig signingConfigs.fixed }", 1)
          open(p, "w").write(s)
          PY
          pip install -q pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open("../docs/icons/icon-512.png").convert("RGBA")
          res = "android/app/src/main/res"
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          for d, n in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              os.makedirs(f"{res}/mipmap-{d}", exist_ok=True)
              for f in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  src.resize((n, n), Image.LANCZOS).save(f"{res}/mipmap-{d}/{f}")
          PY
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs android-app/android/app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256' | head -1 | awk '{print $NF}')
          EXPECTED_CERT_SHA256=$(cat android-app/signing-cert.sha256)
          echo "expected: $EXPECTED_CERT_SHA256"; echo "actual:   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::署名が固定鍵と一致しません（上書きインストールできない APK は配布しない）"; exit 1; }
      - name: Publish APK (release)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk ai-daily.apk
          gh release create "android-${{ github.run_number }}" ai-daily.apk --title "AI Daily #${{ github.run_number }}" \
            --notes "スマホのブラウザから ai-daily.apk をタップしてインストール（上書き更新可）。常に最新: https://github.com/ma-garin/github_star_ranking/releases/latest/download/ai-daily.apk" --latest
