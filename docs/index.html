<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Star Ranking</title>
<style>
:root{--bg:#0f0d14;--card:#1a1722;--line:#2a2633;--fg:#ece9f2;--mut:#9a94a8;--acc:#f5a524;--pink:#ff7ac6;--g1:#f5c451;--g2:#cfd3dc;--g3:#d99a6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.eyebrow{letter-spacing:.3em;font-size:11px;color:var(--acc)}
h1{font-size:26px;margin:4px 0 2px}h1 em{font-style:normal;color:var(--pink)}
.meta{color:var(--mut);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:none;color:var(--mut);padding:6px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tab[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select,input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
input{flex:1;min-width:120px}
ol{list-style:none;padding:0;margin:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rk{font:700 22px/1 Georgia,serif;text-align:center;color:var(--mut)}
li:nth-child(1) .rk{color:var(--g1)}li:nth-child(2) .rk{color:var(--g2)}li:nth-child(3) .rk{color:var(--g3)}
.nm{font-weight:600;word-break:break-all;color:var(--fg);text-decoration:none}.nm:hover{text-decoration:underline}
.ds{color:var(--mut);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nums{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.d{color:var(--acc);font-weight:700}.t{color:var(--mut);font-size:12px}
.lang{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.note{color:var(--mut);font-size:12px;margin-top:16px}
.empty{color:var(--mut);padding:24px;text-align:center}
@media (max-width:480px){li{grid-template-columns:32px 1fr;}.nums{grid-column:2;text-align:left}.rk{font-size:18px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">LEADERBOARD</div>
  <h1>GitHub <em>スター</em>獲得ランキング</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <div class="bar">
    <button class="tab" data-k="weekly" aria-selected="true">週間 Top30</button>
    <button class="tab" data-k="daily" aria-selected="false">前日比 Top30</button>
    <select id="date" aria-label="日付"></select>
    <input id="q" type="search" placeholder="絞り込み（例: skill）" aria-label="絞り込み">
  </div>
  <ol id="list"></ol>
  <p class="note">† Trending の表示値（スナップショット履歴が7日分たまるまでの補完）　★ 期間内に新規作成</p>
</main>
<script>
const MARK={snapshot:"",trending:"†",new:"★"};
let data=null,kind="weekly";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  if(!data){return}
  const q=$("#q").value.trim().toLowerCase();
  const rows=(data[kind]||[]).filter(r=>!q||(r.full_name+" "+r.description+" "+(r.summary_ja||"")).toLowerCase().includes(q));
  $("#meta").textContent=`${data.date} 集計 ・ 追跡 ${data.pool_size} リポジトリ`;
  $("#list").innerHTML=rows.length?rows.map(r=>`<li>
    <div class="rk">${r.rank}</div>
    <div><a class="nm" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full_name)}</a>${r.language?`<span class="lang">${esc(r.language)}</span>`:""}
      <div class="ds">${esc(r.summary_ja||r.description)}</div></div>
    <div class="nums"><div class="d">+${r.delta.toLocaleString()}${MARK[r.basis]||""}<span class="t">/${kind==="weekly"?"週":"日"}</span></div>
      <div class="t">累計 ${r.stars.toLocaleString()}</div></div></li>`).join(""):`<div class="empty">該当なし</div>`;
}
async function load(name){
  try{data=await (await fetch(`data/${name}.json`,{cache:"no-store"})).json()}
  catch(e){data=window.__DATA__||null;if(!data){$("#meta").textContent="データを読み込めませんでした"}}
  render();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render()});
$("#q").oninput=render;
$("#date").onchange=e=>load(e.target.value);
(async()=>{
  let dates=[];
  try{dates=await (await fetch("data/index.json",{cache:"no-store"})).json()}catch(e){}
  $("#date").innerHTML=dates.map(d=>`<option>${d}</option>`).join("")||"<option>latest</option>";
  load(dates[0]||"latest");
})();
</script>
</body>
</html>
